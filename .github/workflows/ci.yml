name: CI

# Network Vitals is a single, pure-stdlib script (no third-party runtime deps),
# so CI just needs a Python and — for the signed-update tests, and for exercising
# tools/sign_release.sh — openssl, both of which the GitHub-hosted runners already
# provide. The release script is also shellchecked; see the `shellcheck` job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run when new commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux across the supported range (README: Python 3.8+), plus the
        # primary target platform (Windows) and macOS on the pinned version.
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: |
          python --version
          openssl version

      - name: Byte-compile the whole tree (syntax check)
        run: python -m compileall -q netquality.py tests

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  lint:
    name: lint (flake8 pyflakes checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flake8
        run: python -m pip install --upgrade flake8
      # Only the pyflakes (F) checks — real errors like unused/undefined names —
      # not pycodestyle style nits. flake8 honours the `# noqa: F401` markers on
      # the intentional platform-availability import probes.
      - name: Run flake8
        run: python -m flake8 --select=F netquality.py tests

  shellcheck:
    name: shellcheck (tools/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ShellCheck ships on the GitHub-hosted ubuntu images; install only if that
      # ever stops being true, so the common path stays fast.
      - name: Ensure shellcheck
        run: |
          command -v shellcheck >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          shellcheck --version
      # Default severity (error, warning, info and style) - tools/ is one small
      # script and it is clean at that level, so there is nothing to gain by
      # relaxing it.
      - name: Lint shell scripts
        run: shellcheck tools/*.sh
      - name: Check they are executable and have a shebang
        run: |
          status=0
          for f in tools/*.sh; do
            [ -x "$f" ] || { echo "not executable: $f" >&2; status=1; }
            head -1 "$f" | grep -q '^#!' || { echo "no shebang: $f" >&2; status=1; }
          done
          exit "$status"

  # ChaosLab (chaoslab/) is a separate tool in this repository: a Python stdlib controller and a Go
  # endpoint agent. Its tests need no network beyond loopback.
  chaoslab:
    name: chaoslab (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: chaoslab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Agent, formatting and vet (Linux and Windows)
        run: |
          cd agent
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          GOOS=windows go vet ./...
      - name: Agent, measurement against ground truth
        run: cd agent && go test -count=1 ./...
      - name: Build the agents the controller serves
        run: python -m chaoslab build-agents
      - name: Controller lint (pyflakes checks)
        run: |
          python -m pip install --upgrade flake8
          python -m flake8 --select=F chaoslab tests
      - name: Controller tests (includes two real agents on loopback)
        run: python -W ignore -m unittest discover -s tests -t . -v

